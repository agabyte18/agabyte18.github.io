<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>MySQL Performance Monitoring, Troubleshooting, and Automated Maintenance</title>
    <meta name="description" content="Course files and scripts for MySQL Performance Monitoring, Troubleshooting, and Automated Maintenance, by Philip Agaba.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">

    <link rel="icon" type="image/png" href="favicon-lg.png">

    <style>
      :root {
        --ink: #130F25;
        --pink: #FF1675;
      }

      * { box-sizing: border-box; }

      html, body { margin: 0; min-height: 100%; }

      body {
        min-height: 100vh;
        background-color: #fff;
        background-image: radial-gradient(rgba(19, 15, 37, 0.05) 2px, transparent 2.5px);
        background-size: 28px 28px;
        color: var(--ink);
        font-family: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
        position: relative;
        overflow-x: hidden;
      }

      /* Pink half circles in the bottom corners, like the title slide */
      body::before,
      body::after {
        content: "";
        position: absolute;
        bottom: 0;
        width: clamp(90px, 11vw, 210px);
        height: clamp(90px, 11vw, 210px);
        background: var(--pink);
        z-index: 0;
      }
      body::before { left: 0; border-radius: 0 100% 0 0; }
      body::after  { right: 0; border-radius: 100% 0 0 0; }

      main {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        padding: clamp(24px, 6vw, 110px);
        padding-bottom: clamp(120px, 14vw, 240px);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 48px;
      }

      h1 {
        margin: 0;
        max-width: 22ch;
        font-size: clamp(2.1rem, 5.2vw, 4.8rem);
        font-weight: 800;
        line-height: 1.08;
        letter-spacing: -0.01em;
      }

      .subtitle {
        margin: 0.7em 0 0;
        font-size: clamp(1.3rem, 3.2vw, 2.7rem);
        font-weight: 600;
      }

      .author {
        display: flex;
        align-items: center;
        gap: clamp(16px, 2.6vw, 48px);
      }

      .author img {
        width: clamp(84px, 11vw, 210px);
        height: clamp(84px, 11vw, 210px);
        border-radius: 50%;
        object-fit: cover;
        flex: none;
      }

      .name { margin: 0; font-size: clamp(1.2rem, 2.5vw, 2.4rem); font-weight: 800; }
      .role { margin: 0.2em 0 0.9em; font-size: clamp(1rem, 1.8vw, 1.7rem); }

      a { color: var(--ink); text-decoration: none; }
      .site { font-size: clamp(0.95rem, 1.5vw, 1.4rem); }
      .site:hover, .download:hover { color: var(--pink); }

      .download {
        display: inline-block;
        margin-top: 1.4em;
        font-weight: 600;
        font-size: clamp(1rem, 1.6vw, 1.5rem);
        border-bottom: 2px solid var(--pink);
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>MySQL Performance Monitoring, Troubleshooting, and Automated Maintenance</h1>
        <p class="subtitle">Course files and scripts</p>
        <a class="download" href="mysqlperf.tar.gz">Download all three modules (.tar.gz)</a>
      </header>

      <section class="author">
        <img src="author.png" alt="Philip Agaba">
        <div>
          <p class="name">Philip Agaba</p>
          <p class="role">Senior Software Engineer</p>
          <a class="site" href="https://agabyte.com">agabyte.com</a>
        </div>
      </section>
    </main>
  </body>
</html>
